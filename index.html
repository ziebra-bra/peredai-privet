    .intro { min-width: 0; }
    .stamp { margin: 0 0 40px; color: var(--color-soft-white); font: 400 14px/1.5 var(--font-whyte-inktrap-mono); letter-spacing: .2em; text-transform: uppercase; }

    .intro p { max-width: 420px; margin: 36px 0 0; color: var(--color-almost-white); font-size: 20px; font-weight: 300; line-height: 1.5; }
    .pass { min-width: 0; padding: 40px; border: 1px solid rgba(247,249,250,.2); border-radius: 19.2px; background: rgba(237,195,196,.05); }
    .pass-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 48px; }
    .pass-head span { font: 400 12px/1.5 var(--font-whyte-inktrap-mono); letter-spacing: .2em; text-transform: uppercase; }
    .barcode { width: 54px; height: 40px; flex: none; opacity: .75; background: repeating-linear-gradient(90deg, var(--color-almost-white) 0 1px, transparent 1px 3px, var(--color-almost-white) 3px 5px, transparent 5px 8px); }
    .route { margin: 0 0 36px; padding-bottom: 18px; border-bottom: 1px solid rgba(247,249,250,.2); color: var(--color-almost-white); font: 400 14px/1.5 var(--font-whyte-inktrap-mono); letter-spacing: .06em; }
    label { display: block; margin-bottom: 14px; font-size: 20px; letter-spacing: -.01em; }
    textarea { display: block; width: 100%; min-height: 160px; padding: 16px; resize: vertical; border: 1px solid rgba(247,249,250,.35); border-radius: 8px; background: rgba(9,9,9,.45); color: var(--color-almost-white); font: 400 16px/1.5 var(--font-whyte-inktrap); }
    textarea::placeholder { color: var(--color-steel); }
    textarea:focus-visible { outline: 2px solid var(--color-lavender-mist); outline-offset: 2px; }
    .hint { margin: 12px 0 24px; color: var(--color-almost-white); font: 400 12px/1.5 var(--font-whyte-inktrap-mono); letter-spacing: .07em; }
    button { width: 100%; min-height: 56px; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 16px; border: 0; border-radius: 8px; background: var(--color-signal-violet); color: var(--color-near-black); font: 500 16px/1.5 var(--font-whyte-inktrap); cursor: pointer; }
    button:not(:disabled):hover { background: var(--color-lavender-mist); }
    button:focus-visible { outline: 2px solid var(--color-almost-white); outline-offset: 3px; }
    button:disabled { opacity: .7; cursor: default; }
    .footer { width: min(100% - 48px, 1200px); min-height: 80px; margin: auto; display: flex; justify-content: space-between; align-items: center; gap: 20px; color: var(--color-almost-white); font: 400 14px/1.5 var(--font-whyte-inktrap); }

    .footer a:hover, .footer a:focus-visible { color: var(--color-almost-white); }

      .hero-inner { gap: 44px; padding-top: 120px; padding-bottom: 64px; }
      .stamp { margin-bottom: 24px; font-size: 12px; }
      h1 em { font-size: clamp(62px, 15vw, 88px); }
      h1 span { margin-top: 10px; font-size: 48px; }
      .intro p { font-size: 18px; }
      .pass { padding: 28px 24px; }
      .pass-head { margin-bottom: 28px; }
      .route { margin-bottom: 24px; }
      .footer { padding: 20px 0; flex-wrap: wrap; }

<body>
  <header class="nav"><div class="nav-inner"><strong>ZIEBRA</strong><span>ПЕРЕДАЙ ПРИВЕТ</span></div></header>
  <main class="hero">
    <div class="hero-inner">
      <section class="intro" aria-labelledby="title">
        <div class="stamp">ПЕРЕДАЙ ПРИВЕТ</div>
        <h1 id="title"><em>Передай</em><span>привет.</span></h1>
        <p id="message" role="status" aria-live="polite">Напиши пару слов — сообщение придёт ко мне на почту.</p>
      </section>
      <section class="pass" aria-label="Форма сообщения">
        <div class="pass-head"><span>СООБЩЕНИЕ</span><span class="barcode" aria-hidden="true"></span></div>
        <p class="route">ТВОЁ СООБЩЕНИЕ → МОЯ ПОЧТА</p>
        <form id="hello-form" action="https://formspree.io/f/mqpaynnz" method="POST">
          <label for="greeting">Твоё сообщение</label>
          <textarea id="greeting" name="message" rows="5" maxlength="1000" placeholder="Напиши что-нибудь приятное…" required></textarea>
          <input type="hidden" name="_subject" value="Привет с сайта">
          <p class="hint">ДО 1000 СИМВОЛОВ · БЕЗ РЕГИСТРАЦИИ</p>
          <button type="submit" id="hello"><span>Отправить привет</span><span aria-hidden="true">↗</span></button>
        </form>
      </section>
    </div>
  </main>
  <footer class="footer"><span>+ ПЕРЕДАЙ ПРИВЕТ</span><span><a href="https://commons.wikimedia.org/wiki/File:Purple_sunset_(12646049723).jpg" target="_blank" rel="noopener noreferrer">Фото: Michael D Beckwith · цветокоррекция и уменьшение</a> · <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noopener noreferrer">CC BY 2.0</a></span></footer>
  <script>
    const form = document.getElementById('hello-form');
    const button = document.getElementById('hello');
    const message = document.getElementById('message');
    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'Отправляем…';
      message.textContent = 'Отправляем привет…';
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { Accept: 'application/json' }
        });
        if (!response.ok) throw new Error('Formspree rejected the submission');
        message.textContent = 'Привет принят! Проверь свою почту.';
        button.textContent = 'Готово ✓';
      } catch (error) {
        message.textContent = 'Не получилось отправить. Попробуй ещё раз.';
        button.textContent = 'Повторить ↗';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
