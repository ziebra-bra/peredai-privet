<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171b1a">
  <title>Передай привет</title>
  <style>
    :root { color-scheme: dark; --bg:#171b1a; --ink:#f2eee4; --muted:#a5aca5; --accent:#ffb86a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100svh; background:var(--bg); color:var(--ink); font-family:Georgia, "Times New Roman", serif; }
    main { max-width:1120px; min-height:100svh; margin:auto; padding:clamp(28px,5vw,72px); display:flex; flex-direction:column; justify-content:space-between; }
    header, footer { display:flex; align-items:center; justify-content:space-between; gap:24px; font:600 12px/1.5 system-ui,sans-serif; letter-spacing:.15em; text-transform:uppercase; }
    .mark { display:flex; align-items:center; gap:12px; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 20px #ffb86a80; }
    .muted { color:var(--muted); }
    .hero { padding:64px 0 84px; }
    .eyebrow { color:var(--accent); font:600 13px system-ui,sans-serif; letter-spacing:.19em; text-transform:uppercase; }
    h1 { max-width:900px; margin:26px 0 34px; font-size:clamp(64px,11vw,148px); font-weight:400; letter-spacing:-.075em; line-height:.91; }
    h1 em { color:var(--accent); font-weight:400; }
    p { max-width:490px; margin:0 0 36px; color:#c5c9c1; font:18px/1.6 system-ui,sans-serif; }
    button { min-height:48px; padding:12px 22px; border:1px solid var(--accent); border-radius:0; background:transparent; color:var(--accent); font:600 13px system-ui,sans-serif; cursor:pointer; transition:background .2s,color .2s; }
    button:hover,button:focus-visible { background:var(--accent); color:var(--bg); }
    button:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
    footer { padding-top:24px; border-top:1px solid #3d4440; }
    @media (max-width:600px) { header,footer { align-items:flex-start; } .hero { padding:100px 0 70px; } h1 { font-size:clamp(62px,16vw,90px); } p { font-size:16px; } }
    @media (prefers-reduced-motion:reduce) { button { transition:none; } }
  </style>
</head>
<body>
  <main>
    <header><span class="mark"><span class="dot" aria-hidden="true"></span> Ziebra / Привет</span><span class="muted">Одна страница. Один файл.</span></header>
    <section class="hero" aria-labelledby="title">
      <div class="eyebrow">Маленькое послание</div>
      <h1 id="title">Передай<br><em>привет.</em></h1>
      <p id="message">Нажми кнопку — и привет вернётся к тебе. Иногда для хорошего настроения большего не нужно.</p>
      <button type="button" id="hello">Передать привет ↗</button>
    </section>
    <footer><span>Сделано для Ziebra</span><span class="muted">Открывай и делись приветом</span></footer>
  </main>
  <script>
    document.getElementById('hello').addEventListener('click', function () {
      document.getElementById('message').textContent = 'Привет передан! 👋 Эта страница работает прямо с твоего компьютера.';
      this.textContent = 'Готово ✓';
    });
  </script>
</body>
</html>
